<!DOCTYPE html>
<!--
  Screen-mirroring receiver for Google Cast (Chromecast, Google TV, Android TV).

  The iPhone app starts this page on the TV (its own Cast application ID, see receiver/README.md) instead of
  Google's Default Media Receiver, and sends the live HLS stream of the iPhone screen to it with the usual
  Cast LOAD message. The page shows only the video, full screen: no title, no LIVE label, no progress bar.
  It also keeps playback close to the live edge, so the picture follows the phone with little delay. The
  reserve it keeps is adaptive (same idea as the phone's web viewer, MirrorViewerPage.swift): small while the
  network is calm, larger after every freeze, smaller again after a calm spell. Add ?debug=1 to the receiver
  address in the Cast console to see the lag and reserve on the TV.

  UNVERIFIED on a TV: `setMediaElement` with our own <video>, and the Shaka settings. Test on a real device.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone Screen</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #dbg { position: fixed; left: 24px; top: 24px; display: none; padding: 6px 12px; border-radius: 8px;
           font: 20px/1.4 monospace; color: #fff; background: rgba(0, 0, 0, 0.6); }
  </style>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <!-- No <cast-media-player>: Cast then draws no player UI of its own, only this video. -->
  <video id="screen" autoplay playsinline muted="false"></video>
  <div id="dbg"></div>

  <script>
    // Live edge with an adaptive reserve. `margin` is the picture kept in reserve just before the next segment
    // arrives: it grows after every freeze and shrinks after a calm spell. The buffer swings between `margin`
    // and `margin + SEGMENT` as segments arrive; beyond that we play a little faster, and jump forward when far
    // behind. Just before running dry we play a little slower.
    const SEGMENT = 0.5;   // seconds per segment: HLSLiveSegmenter.segmentSeconds in the app
    const MIN_MARGIN = 0.15, MAX_MARGIN = 2.0, GROW = 0.35, DECAY = 0.1, CALM_MS = 8000;
    const FAST_EXTRA = 0.5, JUMP_EXTRA = 1.5, FAST_RATE = 1.08, SLOW_RATE = 0.92;

    const video = document.getElementById('screen');
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    playerManager.setMediaElement(video);

    // A live stream: start playing as soon as there is something, keep the buffer small.
    const playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.autoResumeDuration = 0;
    playbackConfig.shakaConfig = {
      streaming: {
        bufferingGoal: 1,
        rebufferingGoal: 0.3,
        bufferBehind: 5,
        lowLatencyMode: true,
        jumpLargeGaps: true
      }
    };

    // The phone sends a LIVE stream without a start time; make sure it starts at the live edge, right away.
    playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
      if (request.media) {
        request.media.streamType = cast.framework.messages.StreamType.LIVE;
        request.media.metadata = undefined;
      }
      request.autoplay = true;
      request.currentTime = undefined;
      return request;
    });

    let margin = MIN_MARGIN, lastTrouble = Date.now(), started = false;
    video.addEventListener('playing', () => { started = true; });
    video.addEventListener('waiting', () => {
      if (!started) { return; }
      margin = Math.min(MAX_MARGIN, margin + GROW);
      lastTrouble = Date.now();
    });
    setInterval(() => {
      if (margin > MIN_MARGIN && Date.now() - lastTrouble > CALM_MS) {
        margin = Math.max(MIN_MARGIN, margin - DECAY);
        lastTrouble = Date.now();
      }
    }, 1000);

    const label = document.getElementById('dbg');
    const debug = location.search.indexOf('debug=1') >= 0;
    if (debug) { label.style.display = 'block'; }

    setInterval(() => {
      if (video.paused || video.readyState < 2 || video.buffered.length === 0) { return; }
      const newest = video.buffered.end(video.buffered.length - 1);
      let lag = newest - video.currentTime;
      if (lag > margin + SEGMENT + JUMP_EXTRA) {
        video.currentTime = Math.max(0, newest - (margin + SEGMENT));
        lag = newest - video.currentTime;
      }
      let rate = 1;
      if (lag > margin + SEGMENT + FAST_EXTRA) { rate = FAST_RATE; }
      else if (lag < margin * 0.5) { rate = SLOW_RATE; }
      if (video.playbackRate !== rate) { video.playbackRate = rate; }
      if (debug) {
        label.textContent = 'behind newest ' + lag.toFixed(2) + ' s | reserve ' + margin.toFixed(2) + ' s | speed ' + rate.toFixed(2);
      }
    }, 200);

    const options = new cast.framework.CastReceiverOptions();
    options.playbackConfig = playbackConfig;
    options.useShakaForHls = true;           // fragmented-MP4 HLS
    options.disableIdleTimeout = true;       // a still screen is not "idle"
    options.maxInactivity = 3600;
    context.start(options);
  </script>
</body>
</html>
